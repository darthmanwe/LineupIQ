[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lineupiq"
version = "0.1.0"
description = "NBA lineup and trade forecasting with a published refusal contract"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kutlu Mizrak" }]
keywords = ["basketball", "nba", "lineups", "rapm", "sports-analytics", "conformal-prediction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Every bound carries the reason it exists. A dependency is added in the phase
# that first imports it -- an unused dependency is a misleading signal about
# what the code actually does.
dependencies = [
    # CLI. Bounded below 1.0 because typer is pre-1.0 and has changed its
    # annotation handling across minors.
    "typer>=0.15,<1",
    "rich>=13,<15",
    # v1 and v2 are different libraries; everything here uses the v2 API.
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    # Transform and gold layers. Bounded below 2.0 because the lazy API is
    # expected to change there and the stint solver leans on it.
    "polars>=1.20,<2",
    # Parquet IO. Major bumps have changed compression and statistics defaults,
    # which would silently invalidate committed contract hashes.
    "pyarrow>=18,<26",
    # Cross-season aggregation over parquet globs, and the SQL parity surface:
    # the same `SELECT * FROM GOLD.SHOT_FACTS` must run here and on Snowflake.
    "duckdb>=1.1,<2",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    # numpy 2 changed the C ABI that scipy and scikit-learn compile against.
    # Bounded below 3 because a major bump would invalidate committed
    # coefficients, and every published metric is asserted to 1e-6.
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    # The shot model and its calibration. Bounded below 2 for the same reason:
    # a solver default changing would move fitted values under a green build.
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
# Operator-only and never run in CI: stats.nba.com refuses datacenter IPs and
# GitHub Actions runners are hosted on Azure. Nothing here is needed to
# reproduce a published number, because gold is committed.
ingest = [
    "nba_api>=1.4,<2",
]
# The Snowflake adapter. Off the demo path entirely -- an extra so that neither
# a clean clone nor CI needs a connector to verify anything.
snowflake = [
    "snowflake-connector-python[pandas]>=3.12,<4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "sqlfluff>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/darthmanwe/LineupIQ"
Repository = "https://github.com/darthmanwe/LineupIQ"
Issues = "https://github.com/darthmanwe/LineupIQ/issues"

[project.scripts]
lineupiq = "lineupiq.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lineupiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline and free by default. A bare `pytest` must pass on a laptop with no
# network, no Snowflake account, and no API key -- otherwise "clone and verify"
# is not a real claim.
addopts = [
    "-m", "not (net or snowflake or llm or slow or repro)",
    "--strict-markers",
    "-ra",
]
markers = [
    "net: requires network access to a public data mirror",
    "snowflake: requires live Snowflake credentials (operator-only)",
    "llm: makes live, billed Anthropic API calls",
    "slow: full-season stint reconstruction or bootstrap",
    "repro: retrains and asserts the committed metrics reproduce",
]

[tool.coverage.run]
source = ["src/lineupiq"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "ARG", "NPY", "PTH"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # typer relies on function calls in argument defaults
    "RUF012", # pydantic validates its own mutable defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
# This module emits markdown prose. The en-dash, multiplication sign and middle
# dot are intended typography in the rendered README, not homoglyph mistakes.
"src/lineupiq/report/render.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
packages = ["lineupiq"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
disallow_untyped_defs = true
