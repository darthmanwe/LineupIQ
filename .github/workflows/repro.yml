name: Reproducibility

# Separate from CI on purpose.
#
# Both models refit from scratch here: the conversion model over nine folds and
# the selection model over nine folds plus two negative controls and a
# within-shooter robustness refit. That is tens of minutes of compute, which is
# the wrong thing to put on every push -- a slow required check is a check people
# learn to ignore.
#
# So it runs nightly and on demand. What it asserts is the claim the whole
# repository rests on: that a clean clone refits the committed run logs to
# within 1e-6, with no network, no key and no account.
on:
  schedule:
    # 04:00 UTC, after nothing and before anyone.
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  ANTHROPIC_API_KEY: ""
  LINEUPIQ_LLM_MAX_CALLS: "0"

concurrency:
  group: repro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    # Generous: the selection model's nine folds are the long pole, and a
    # timeout that trips on a slow runner reads as a reproducibility failure
    # when it is nothing of the kind.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev

      # The memory cap is on by default and refuses to run if it cannot be
      # applied. On a POSIX runner that is RLIMIT_AS, which works; the flag is
      # passed explicitly so a future runner change surfaces here rather than
      # in a confusing MemoryError halfway through fold seven.
      - name: Conversion model refits to the committed metrics
        run: uv run lineupiq train --verify --memory-cap-gb 12

      - name: Selection model refits to the committed metrics
        run: uv run lineupiq selection --verify --memory-cap-gb 12

      # RAPM refits and compares in memory, with a tolerance, for the same
      # reason the parity fixtures do: the run log holds correlations and ridge
      # solutions, and those are not bit-portable. A byte-identity gate here
      # failed on differences of order 1e-15 after every real reproducibility
      # bug in it had been found and fixed, which is a gate reporting on the
      # platform rather than on the model.
      - name: RAPM reproduces
        run: uv run lineupiq rapm --check --memory-cap-gb 12

      # Compared with a tolerance, like every other float artefact here. The
      # byte-diff this replaces was the last one, and adding --check found a real
      # bug on its first run: the placebo pool came out of an unsorted group_by,
      # so a seeded rng.choice drew a different *set* of players between runs and
      # n_placebo moved from 64 to 66. A seed over an unordered population is not
      # reproducibility, and git diff had never noticed because the committed
      # baseline happened to match the machine that wrote it.
      - name: The trade backtest reproduces
        run: uv run lineupiq backtest --check --rule inherit --memory-cap-gb 12
      - name: Assert nothing moved
        working-directory: .
        run: git diff --stat -- services/ml/runs/ data/gold/
