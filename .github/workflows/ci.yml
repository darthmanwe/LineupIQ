name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Belt and braces with the conftest scrub: even if a test tried to reach
# Anthropic, there is no key in the environment to reach it with.
env:
  ANTHROPIC_API_KEY: ""
  LINEUPIQ_LLM_MAX_CALLS: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npm --workspace apps/api run typecheck
      - run: npm --workspace apps/web run typecheck

  # Both operating systems from day one. The author develops on Windows and CI
  # runs on Linux; a path or line-ending assumption that only breaks on one of
  # them is exactly the bug that surfaces the week before it matters.
  js-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Runs inside workerd, not Node. A green suite here has exercised the
      # runtime that actually serves requests.
      - run: npm --workspace apps/api run test

  # Proves the deployable artifact builds. Without this, a broken export is
  # only discovered at deploy time, which is the worst moment to discover it.
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web run build
      - name: Assert the static export produced every page
        run: |
          for page in index lineup/index trade/index evidence/index quality/index 404; do
            test -f "apps/web/out/${page}.html" || { echo "missing apps/web/out/${page}.html"; exit 1; }
          done
          echo "all pages exported"

  py-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  py-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      # Bare pytest is offline and free by marker gating. If this job ever needs
      # a network or a key to pass, the "clone and verify" claim has broken.
      - run: uv run pytest -q

  # Re-derives every committed gold checksum and runs all twelve data-quality
  # gates, offline. This is the job that makes "clone and reproduce" a claim
  # rather than a hope: no network, no key, no Cloudflare account, no Snowflake.
  #
  # Four of the gates exist because of bugs that were silent when found --
  # possessions measuring zero seconds long, attribution drifting off the change
  # of hands, and shots dropped by a one-second clock mismatch between two
  # feeds. See docs/modeling.md.
  data-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run lineupiq verify

  # A stale README fails the build exactly as a stale data contract does.
  # Every published number is rendered from a run log; `report check`
  # re-renders into memory and diffs against what is committed.
  readme-is-current:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run lineupiq report check

  # The load-bearing half of the Snowflake story. `sqlfluff` asserts every .sql
  # file parses as genuine Snowflake on every push -- no account, no cost, no
  # credentials. It has already earned its place: it caught a CREATE RESOURCE
  # MONITOR statement that reads correctly and does not parse.
  #
  # `snowflake check` then asserts the committed DDL still matches the committed
  # data contracts, which catches the failure that actually happens: a gold
  # table gaining a column while the SQL does not.
  snowflake-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
        working-directory: services/ml
      - run: uv run sqlfluff lint --dialect snowflake ../../sql/snowflake/
        working-directory: services/ml
      - run: uv run lineupiq snowflake check
        working-directory: services/ml

  # Python and TypeScript must reach the same lineup hash and the same support
  # tier on every case in the committed fixture. Neither disagreement raises
  # anything at runtime: a hash mismatch returns zero rows everywhere and looks
  # like missing data, and a tier mismatch serves a confident number where
  # Python would have refused.
  #
  # The Python leg regenerates the fixture and asserts it has not moved, so the
  # fixture cannot silently drift to match whichever side changed.
  serve-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: uv sync --extra dev
        working-directory: services/ml
      # `--check` regenerates in memory and compares, rather than writing and
      # diffing. The two fixtures need different comparisons and `git diff`
      # cannot give them: `lineups.json` is integers and MD5 digests, where one
      # differing bit is a bug, while `selection.json` is float64 results of
      # logs, means and exponentials, which are not bit-portable between Linux
      # and Windows. Requiring byte-identity of a float artefact fails on a
      # platform change and passes on a rounding coincidence.
      - run: uv run lineupiq parity --check
        working-directory: services/ml

      # The export is a different case: it is regenerated to disk and diffed,
      # because it is what the Worker actually serves and a stale committed copy
      # is a real defect rather than a rounding one.
      - run: uv run lineupiq export
        working-directory: services/ml
      - name: Assert the committed export is not stale
        run: |
          git diff --exit-code -- apps/web/public/data/ \
            || (echo "::error::Regenerating the export changed it. Commit the new one." && exit 1)
      - run: npm ci
      - run: npm --workspace apps/api run test

  # The retrieval ablation and the groundedness controls, both offline and free.
  #
  # `retrieval ablation` is the job that turns the design document's assertion
  # about document design into a number. The groundedness controls are checked by
  # the unit suite rather than here, because a checker that accepts everything
  # scores 1.00 and only the near-miss control can tell the difference.
  retrieval-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run lineupiq retrieval ablation
      - name: Assert the published ablation is unchanged
        working-directory: .
        run: |
          git diff --exit-code -- services/ml/runs/retrieval/ablation.json             || (echo "::error::The retrieval ablation moved. Re-render the README and commit." && exit 1)

  # The groundedness checker and both its negative controls, offline and free.
  #
  # The assertion is not "the rate is high" -- it is that the three narrative
  # templates SEPARATE. Faithful must reach 100%, overclaiming must fail on
  # tier_consistency despite perfect numeric traceability, and both controls
  # must collapse. A checker that accepts everything also scores 100%, so the
  # controls are what make the first number mean anything.
  groundedness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run lineupiq groundedness
      - name: Assert the published groundedness run is unchanged
        working-directory: .
        run: |
          git diff --exit-code -- services/ml/runs/groundedness/run.json             || (echo "::error::The groundedness run moved. Re-render the README and commit." && exit 1)

  # The refusal contract's floors were fixed before any lineup-level result
  # existed, and the README says so. This is where that claim is enforced: the
  # thresholds file's hash is pinned in a test, so loosening a floor to make a
  # demo look better fails the build rather than passing quietly.
  #
  # `pytest -k support` also walks every tier boundary and asserts the single
  # invariant that matters -- only `reportable` may carry a point estimate.
  no-unsupported-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: uv sync --extra dev
        working-directory: services/ml
      - run: uv run pytest tests/test_support.py -q
        working-directory: services/ml

      # The invariant itself, swept rather than sampled: every lineup in the
      # parity fixture whose tier is `refused` or `directional`, through every
      # live scoring route. The suite also fails if a live POST route appears
      # that the sweep does not know how to gate -- adding a scoring route
      # without gating it is the natural mistake, and it raises nothing.
      - run: npm ci
      - run: npm --workspace apps/api run test -- no-unsupported-numbers
      - name: Assert the pre-registered thresholds hash is unchanged
        working-directory: services/ml
        run: |
          uv run python -c "
          from lineupiq.models.support import thresholds_hash
          from pathlib import Path
          import re
          pinned = re.search(r'PRE_REGISTERED_SHA256 = \"([0-9a-f]{64})\"', Path('tests/test_support.py').read_text(encoding='utf-8'))
          assert pinned, 'the pinned hash is gone from the test'
          actual = thresholds_hash()
          assert actual == pinned.group(1), f'thresholds changed: {actual}'
          print('thresholds unchanged:', actual)
          "

  # Every exported artefact must be valid JSON. Python's json.dumps emits bare
  # NaN and Infinity by default, which are Python literals and not JSON: no
  # browser and no Worker can parse them, so one slipping through is a 500 in
  # production. This has already caught one.
  export-is-valid-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Parse every exported file with a JSON parser that rejects NaN
        run: |
          node -e "
            const fs = require('node:fs');
            const dir = 'apps/web/public/data';
            for (const name of fs.readdirSync(dir)) {
              if (!name.endsWith('.json')) continue;
              const raw = fs.readFileSync(\`\${dir}/\${name}\`, 'utf8');
              try { JSON.parse(raw); } catch (e) {
                console.error(\`::error::\${name} is not valid JSON: \${e.message}\`);
                process.exit(1);
              }
            }
            console.log('every exported file parses');
          "

# ---------------------------------------------------------------------------
# Jobs that land with the milestone that makes them meaningful. They are listed
# here rather than added as always-green stubs, because a job that passes
# without checking anything is worse than an absent one.
#
#   M3  repro                  `train --verify` and `selection --verify`; fail
#                              if any metric moved >1e-6. Not yet wired: both
#                              take tens of minutes on a full refit, so this
#                              needs to be a scheduled job rather than a
#                              per-push one.
# ---------------------------------------------------------------------------
